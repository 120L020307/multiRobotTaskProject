server:
  port: 5199

llm:
  provider: deepseek
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat

spring:
  neo4j:
    uri: ${NEO4J_URI:neo4j://127.0.0.1:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

kg:
  mode: ${KG_MODE:shadow}
  sync-on-startup: ${KG_SYNC_ON_STARTUP:true}
